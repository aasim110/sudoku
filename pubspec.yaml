name: offline_sudoku
description: A production-ready offline Sudoku game built with Flutter.
publish_to: none

version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  audioplayers: ^6.6.0
  clock: ^1.1.2
  collection: ^1.19.1
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.3.1
  freezed_annotation: ^3.1.0
  go_router: ^17.2.3
  intl: ^0.20.2
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  json_annotation: ^4.11.0
  path_provider: ^2.1.5
  riverpod_annotation: ^4.0.2
  shared_preferences: ^2.5.3
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.7.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  integration_test:
    sdk: flutter
  isar_community_generator: ^3.3.2
  json_serializable: ^6.11.1
  mocktail: ^1.0.4
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/
